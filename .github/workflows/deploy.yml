name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run build:server
      - run: npm run build:client

      - name: Package dist
        run: |
          tar -czf deploy.tar.gz \
            packages/client/dist \
            packages/server/dist \
            packages/core/dist \
            packages/database/dist \
            plugins/teams/dist \
            plugins/admin/dist \
            plugins/auth/dist \
            plugins/boards/dist \
            plugins/export/dist \
            plugins/messages/dist \
            plugins/notifications/dist \
            plugins/posts/dist \
            plugins/rss/dist \
            plugins/search/dist \
            plugins/social/dist \
            plugins/theme-default/dist \
            package.json \
            package-lock.json \
            packages/server/package.json \
            packages/database/package.json \
            packages/core/package.json \
            plugins/achievements/package.json \
            plugins/admin/package.json \
            plugins/auth/package.json \
            plugins/boards/package.json \
            plugins/export/package.json \
            plugins/messages/package.json \
            plugins/notifications/package.json \
            plugins/posts/package.json \
            plugins/rss/package.json \
            plugins/search/package.json \
            plugins/social/package.json \
            plugins/teams/package.json \
            plugins/theme-default/package.json

      - name: Upload & extract
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: /opt/campus-forum/
          strip_components: 0

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/campus-forum
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            # 同步依赖：确保新增 npm 包（如 @fastify/multipart、kysely、nodemailer、lru-cache 等）在服务器上安装
            # 不用 --omit=dev：会误删 native optional 依赖（如 @libsql/linux-x64-gnu）
            npm install --no-audit --no-fund --loglevel=error
            npx pm2 restart campus-forum --update-env 2>&1 || npx pm2 start packages/server/dist/index.js --name campus-forum 2>&1
            sleep 5
            curl -sm 5 -A 'Mozilla/5.0' http://localhost:3001/api/health 2>&1 | head -c 200 || echo "HEALTH_CHECK_FAILED"
